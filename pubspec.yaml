name: flutter_chat_app
description: A complete instant messaging application with Firebase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Image handling
  image_picker: ^1.0.7
  image: ^4.1.7
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0

  # Audio recording & playback
  record: ^5.1.0
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.0

  # UI
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  shimmer: ^3.0.0

  # Utils
  connectivity_plus: ^6.0.3
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.11
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
